<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電車が来るまでに</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar" hidden>
    <span id="chTitle"></span>
  </header>

  <main id="stage" class="dusk">
    <div id="bg"></div>
    <div id="sfx"></div>
    <div id="loc"></div>

    <div id="dayBox">
      <div id="who"></div>
      <p id="dayText"></p>
    </div>

    <div id="notebook" hidden>
      <div class="paper" id="paper">
        <div class="by" id="by"></div>
        <p id="noteText"></p>
      </div>
    </div>

    <div id="choices"></div>
    <div id="hint">クリック / Enter で次へ ▼</div>
    <div id="fade"></div>
  </main>

  <div id="titleScreen">
    <h1>電車が来るまで交換日記</h1>
    <button id="newBtn">はじめから</button>
    <button id="contBtn" hidden>つづきから</button>
    <p class="note">章のはじめに自動セーブされます。</p>
  </div>

  <div id="ending" hidden>
    <div class="ending-body">
      <h2 id="endTitle">おわり</h2>
      <p id="endName"></p>
      <ul id="endStats"></ul>
      <button id="retryBtn">もう一度遊ぶ</button>
    </div>
  </div>
</div>

<script src="story.js"></script>
<script src="game.js"></script>
</body>
</html>
